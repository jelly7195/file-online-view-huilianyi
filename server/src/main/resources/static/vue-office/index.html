<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在HTML中使用vue-office-excel</title>

    <link rel="stylesheet" href="excel.css" />
    <script src="excel.umd.js?v=richtext-20260616-2"></script>
    <script src="../js/base64.min.js" type="text/javascript"></script>

    <style>
        /* 确保页面占满全屏 */
        /*html, body {*/
        /*    margin: 0;*/
        /*    padding: 0;*/
        /*    height: 100%;*/
        /*    overflow: hidden; !* 避免页面整体滚动 *!*/
        /*}*/

        /* loading遮罩层样式 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* 简单的旋转动画 */
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-left: 15px;
            font-size: 16px;
            color: #333;
            font-family: sans-serif;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<!-- Loading 遮罩层 -->
<div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Loading and parsing the file, please wait...</div>
</div>

<div id="excel" style="width: 100vw; height: 100vh"></div>

<script>
    // 如果jsPreviewExcel支持配置选项
    const options = {
        "minColLength": 20,
        "minRowLength": 100,
        "widthOffset": 10, //在默认渲染的列表宽度上再加10px宽
        "heightOffset": 10, //在默认渲染的列表高度上再加10px高
        "beforeTransformData": function (workbookData){
            const indexedColors = [
                '#000000', '#FFFFFF', '#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF', '#00FFFF',
                '#000000', '#FFFFFF', '#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF', '#00FFFF',
                '#800000', '#008000', '#000080', '#808000', '#800080', '#008080', '#C0C0C0', '#808080',
                '#9999FF', '#993366', '#FFFFCC', '#CCFFFF', '#660066', '#FF8080', '#0066CC', '#CCCCFF',
                '#000080', '#FF00FF', '#FFFF00', '#00FFFF', '#800080', '#800000', '#008080', '#0000FF',
                '#00CCFF', '#CCFFFF', '#CCFFCC', '#FFFF99', '#99CCFF', '#FF99CC', '#CC99FF', '#FFCC99',
                '#3366FF', '#33CCCC', '#99CC00', '#FFCC00', '#FF9900', '#FF6600', '#666699', '#969696',
                '#003366', '#339966', '#003300', '#333300', '#993300', '#993366', '#333399', '#333333',
            ];
            const themeColors = [
                '#FFFFFF', '#000000', '#BFBFBF', '#323232', '#4472C4',
                '#ED7D31', '#A5A5A5', '#FFC000', '#5B9BD5', '#71AD47',
            ];
            const normalizeArgbColor = (argb) => {
                if (typeof argb !== 'string') return null;
                const hex = argb.replace(/^#/, '').trim();
                if (/^[0-9a-f]{8}$/i.test(hex)) return `#${hex.slice(2)}`.toUpperCase();
                if (/^[0-9a-f]{6}$/i.test(hex)) return `#${hex}`.toUpperCase();
                return null;
            };
            const normalizeIndexedColor = (indexed) => {
                const index = Number(indexed);
                if (index === 64) return '#000000';
                return Object.prototype.hasOwnProperty.call(indexedColors, index) ? indexedColors[index] : null;
            };
            const parseHexColor = (color) => {
                const hex = normalizeArgbColor(color);
                if (!hex) return null;
                return [
                    parseInt(hex.slice(1, 3), 16),
                    parseInt(hex.slice(3, 5), 16),
                    parseInt(hex.slice(5, 7), 16),
                ];
            };
            const rgbToHex = (r, g, b) => {
                const toHex = (value) => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0');
                return `#${toHex(r)}${toHex(g)}${toHex(b)}`.toUpperCase();
            };
            const applyTint = (color, tint) => {
                const rgb = parseHexColor(color);
                if (!rgb) return color;
                const tintValue = Number(tint);
                if (!Number.isFinite(tintValue) || tintValue === 0) return color.toUpperCase();
                if (tintValue > 0) {
                    return rgbToHex(
                        rgb[0] + (255 - rgb[0]) * tintValue,
                        rgb[1] + (255 - rgb[1]) * tintValue,
                        rgb[2] + (255 - rgb[2]) * tintValue,
                    );
                }
                return rgbToHex(
                    rgb[0] * (1 + tintValue),
                    rgb[1] * (1 + tintValue),
                    rgb[2] * (1 + tintValue),
                );
            };
            const normalizeThemeColor = (theme, tint) => {
                const index = Number(theme);
                if (!Object.prototype.hasOwnProperty.call(themeColors, index)) return null;
                return applyTint(themeColors[index], tint);
            };
            const normalizeFontColor = (color) => {
                if (!color) return null;
                if (typeof color === 'string') return normalizeArgbColor(color);
                const argbColor = normalizeArgbColor(color.argb || color.rgb);
                if (argbColor) return argbColor;
                if (Object.prototype.hasOwnProperty.call(color, 'theme')) {
                    const themeColor = normalizeThemeColor(color.theme, color.tint);
                    if (themeColor) return themeColor;
                }
                return normalizeIndexedColor(color.indexed);
            };
            const normalizeRichFont = (font) => {
                if (!font) return {};
                const result = {};
                if (font.name || font.rFont) result.name = font.name || font.rFont;
                if (font.size || font.sz) result.size = Number(font.size || font.sz);
                if (font.bold) result.bold = true;
                if (font.b) result.bold = true;
                if (font.italic) result.italic = true;
                if (font.i) result.italic = true;
                if (font.underline) result.underline = true;
                if (font.u) result.underline = true;
                if (font.strike) result.strike = true;
                if (font.strikeThrough) result.strike = true;
                const fontColor = normalizeFontColor(font.color);
                if (fontColor) result.color = fontColor;
                return result;
            };
            const extractRichTextRuns = (cell) => {
                if (!cell) return null;
                const candidates = [
                    cell.value,
                    cell.model && cell.model.value,
                    cell._value && cell._value.model && cell._value.model.value,
                    cell._value && cell._value.model,
                    cell._value && cell._value.value,
                    cell._value,
                ];
                for (let i = 0; i < candidates.length; i += 1) {
                    const candidate = candidates[i];
                    if (candidate && Array.isArray(candidate.richText)) return candidate.richText;
                    if (candidate && Array.isArray(candidate.texts)) return candidate.texts;
                }
                return null;
            };
            const collectWorksheets = (workbook) => {
                const sheets = [];
                if (workbook && typeof workbook.eachSheet === 'function') {
                    workbook.eachSheet((sheet) => {
                        if (sheet) sheets.push(sheet);
                    });
                }
                if (sheets.length === 0 && workbook && Array.isArray(workbook._worksheets)) {
                    workbook._worksheets.forEach((sheet) => {
                        if (sheet) sheets.push(sheet);
                    });
                }
                return sheets;
            };
            const forEachRow = (sheet, callback) => {
                if (sheet && Array.isArray(sheet._rows)) {
                    sheet._rows.forEach((row, rowIndex) => {
                        if (row) callback(row, rowIndex);
                    });
                    return;
                }
                if (sheet && typeof sheet.eachRow === 'function') {
                    sheet.eachRow({ includeEmpty: false }, (row, rowNumber) => callback(row, rowNumber - 1));
                }
            };
            const forEachCell = (row, callback) => {
                if (row && Array.isArray(row._cells)) {
                    row._cells.forEach((cell, colIndex) => {
                        if (cell) callback(cell, colIndex);
                    });
                    return;
                }
                if (row && typeof row.eachCell === 'function') {
                    row.eachCell({ includeEmpty: false }, (cell, colNumber) => callback(cell, colNumber - 1));
                }
            };
            const richTextMeta = [];
            collectWorksheets(workbookData).forEach((sheet) => {
                const sheetMeta = {};
                forEachRow(sheet, (row, rowIndex) => {
                    forEachCell(row, (cell, colIndex) => {
                        const richText = extractRichTextRuns(cell);
                        if (!richText || richText.length === 0) return;
                        sheetMeta[`${rowIndex}:${colIndex}`] = richText.map((run) => ({
                            text: run && run.text ? String(run.text) : '',
                            font: normalizeRichFont(run && run.font),
                        })).filter((run) => run.text.length > 0);
                    });
                });
                richTextMeta.push(sheetMeta);
            });
            window.__excelRichTextMeta = richTextMeta;
            document.body.dataset.richTextSheets = String(richTextMeta.length);
            document.body.dataset.richTextCells = String(richTextMeta.reduce((count, sheet) => count + Object.keys(sheet).length, 0));
            return workbookData;
        },
        "transformData": function (workbookData){
            //修改workbookData，可以打印出来看看数据格式
            // return workbookData;
            // console.log('workbookData', workbookData);
            const getHiddenRowIndexes = (sheet, sheetIndex) => {
                const result = new Set();
                const config = sheet && sheet.config;
                const rowhidden = config && (config.rowhidden || config.rowHidden || config.rowHiddenData);
                if (rowhidden && typeof rowhidden === 'object' && !Array.isArray(rowhidden)) {
                    Object.keys(rowhidden).forEach((k) => {
                        const n = Number(k);
                        if (Number.isInteger(n)) result.add(n);
                    });
                }

                const rows = sheet && sheet.rows;
                if (Array.isArray(rows)) {
                    rows.forEach((row, idx) => {
                        if (row && (row.hidden === true || row.hide === true || row.hid === true || row.h === 0 || row.height === 0)) result.add(idx);
                    });
                }

                const hiddenRowsArr = sheet && (sheet.hiddenRows || sheet.hiddenRowIndexes);
                if (Array.isArray(hiddenRowsArr)) {
                    hiddenRowsArr.forEach((r) => {
                        const n = Number(r);
                        if (Number.isInteger(n)) result.add(n);
                    });
                }

                const meta = window.__excelHiddenMeta;
                if (meta && meta.sheets && meta.sheets[sheetIndex] && Array.isArray(meta.sheets[sheetIndex].hiddenRows)) {
                    meta.sheets[sheetIndex].hiddenRows.forEach((r) => {
                        const n = Number(r);
                        if (Number.isInteger(n)) result.add(n);
                    });
                }

                return Array.from(result).sort((a, b) => a - b);
            };

            const applyHiddenRows = (sheet, hiddenRows) => {
                if (!hiddenRows || hiddenRows.length === 0) return;
                if (!sheet.config) sheet.config = {};
                if (!sheet.config.rowhidden) sheet.config.rowhidden = {};
                hiddenRows.forEach((r) => {
                    sheet.config.rowhidden[r] = 1;
                });

                const rowlen = sheet.config.rowlen;
                if (rowlen && typeof rowlen === 'object') {
                    hiddenRows.forEach((r) => {
                        rowlen[r] = 0;
                    });
                }

                const rowlen2 = sheet.rowlen;
                if (rowlen2 && typeof rowlen2 === 'object') {
                    hiddenRows.forEach((r) => {
                        rowlen2[r] = 0;
                    });
                }

                const rows = sheet.rows;
                if (Array.isArray(rows)) {
                    hiddenRows.forEach((r) => {
                        if (!rows[r]) return;
                        rows[r].h = 0;
                        rows[r].height = 0;
                        rows[r].hidden = true;
                    });
                }
                if (rows && !Array.isArray(rows) && typeof rows === 'object') {
                    hiddenRows.forEach((r) => {
                        const existing = rows[r] && typeof rows[r] === 'object' ? rows[r] : {};
                        rows[r] = Object.assign({}, existing, { h: 0, height: 0, hidden: true, hide: true });
                    });
                }
            };

            const getHiddenColIndexes = (sheet, sheetIndex) => {
                const result = new Set();
                const config = sheet && sheet.config;
                const colhidden = config && (config.colhidden || config.colHidden || config.columnHidden);
                if (colhidden && typeof colhidden === 'object' && !Array.isArray(colhidden)) {
                    Object.keys(colhidden).forEach((k) => {
                        const n = Number(k);
                        if (Number.isInteger(n)) result.add(n);
                    });
                }
                const colsFromSheetJs = sheet && sheet["!cols"];
                if (Array.isArray(colsFromSheetJs)) {
                    colsFromSheetJs.forEach((col, idx) => {
                        if (col && (col.hidden === true || col.hide === true || col.hid === true)) result.add(idx);
                    });
                }
                const cols = sheet && sheet.cols;
                if (Array.isArray(cols)) {
                    cols.forEach((col, idx) => {
                        if (col && (col.hidden === true || col.hide === true || col.hid === true)) result.add(idx);
                    });
                }
                const hiddenColsArr = sheet && (sheet.hiddenCols || sheet.hiddenColumns);
                if (Array.isArray(hiddenColsArr)) {
                    hiddenColsArr.forEach((c) => {
                        const n = Number(c);
                        if (Number.isInteger(n)) result.add(n);
                    });
                }

                const meta = window.__excelHiddenMeta;
                if (meta && meta.sheets && meta.sheets[sheetIndex] && Array.isArray(meta.sheets[sheetIndex].hiddenCols)) {
                    meta.sheets[sheetIndex].hiddenCols.forEach((c) => {
                        const n = Number(c);
                        if (Number.isInteger(n)) result.add(n);
                    });
                }

                return Array.from(result).sort((a, b) => a - b);
            };

            const applyHiddenCols = (sheet, hiddenCols) => {
                if (!hiddenCols || hiddenCols.length === 0) return;
                if (!sheet.config) sheet.config = {};
                if (!sheet.config.colhidden) sheet.config.colhidden = {};
                hiddenCols.forEach((c) => {
                    sheet.config.colhidden[c] = 1;
                });

                const columnlen = sheet.config.columnlen;
                if (columnlen && typeof columnlen === 'object') {
                    hiddenCols.forEach((c) => {
                        columnlen[c] = 0;
                    });
                }

                const columnlen2 = sheet.columnlen;
                if (columnlen2 && typeof columnlen2 === 'object') {
                    hiddenCols.forEach((c) => {
                        columnlen2[c] = 0;
                    });
                }

                const cols = sheet.cols;
                if (Array.isArray(cols)) {
                    hiddenCols.forEach((c) => {
                        if (!cols[c]) return;
                        cols[c].w = 0;
                        cols[c].width = 0;
                        cols[c].hidden = true;
                    });
                }
                if (cols && !Array.isArray(cols) && typeof cols === 'object') {
                    hiddenCols.forEach((c) => {
                        const existing = cols[c] && typeof cols[c] === 'object' ? cols[c] : {};
                        cols[c] = Object.assign({}, existing, { w: 0, width: 0, hidden: true, hide: true });
                    });
                }

                const colsFromSheetJs = sheet["!cols"];
                if (Array.isArray(colsFromSheetJs)) {
                    hiddenCols.forEach((c) => {
                        if (!colsFromSheetJs[c]) colsFromSheetJs[c] = {};
                        colsFromSheetJs[c].wpx = 0;
                        colsFromSheetJs[c].wch = 0;
                        colsFromSheetJs[c].hidden = true;
                    });
                }

                const columns = sheet.columns;
                if (Array.isArray(columns)) {
                    hiddenCols.forEach((c) => {
                        if (!columns[c]) return;
                        columns[c].w = 0;
                        columns[c].width = 0;
                        columns[c].hidden = true;
                    });
                }
                if (columns && !Array.isArray(columns) && typeof columns === 'object') {
                    hiddenCols.forEach((c) => {
                        const existing = columns[c] && typeof columns[c] === 'object' ? columns[c] : {};
                        columns[c] = Object.assign({}, existing, { w: 0, width: 0, hidden: true, hide: true });
                    });
                }
            };

            const parseHexColor = (color) => {
                if (typeof color !== 'string') return null;
                const match = /^#?([0-9a-f]{6})$/i.exec(color.trim());
                if (!match) return null;
                return {
                    r: parseInt(match[1].slice(0, 2), 16),
                    g: parseInt(match[1].slice(2, 4), 16),
                    b: parseInt(match[1].slice(4, 6), 16),
                };
            };

            const colorLuminance = (color) => {
                const rgb = parseHexColor(color);
                if (!rgb) return null;
                return (rgb.r * 299 + rgb.g * 587 + rgb.b * 114) / 1000;
            };

            const isWhiteColor = (color) => {
                const rgb = parseHexColor(color);
                return !!rgb && rgb.r >= 245 && rgb.g >= 245 && rgb.b >= 245;
            };

            const isDarkColor = (color) => {
                const luminance = colorLuminance(color);
                return luminance !== null && luminance < 128;
            };

            const normalizeAutomaticFontColor = (style) => {
                const fontColor = style && style.font && style.font.color;
                const isAutomaticIndexedColor = !!fontColor
                    && Number(fontColor.indexed) === 64
                    && !fontColor.argb
                    && !Object.prototype.hasOwnProperty.call(fontColor, 'theme');
                const isInvisibleOnLightBackground = isWhiteColor(style && style.color) && !isDarkColor(style && style.bgcolor);
                if (!isAutomaticIndexedColor && !isInvisibleOnLightBackground) {
                    return;
                }
                // Excel indexed color 64 is automatic text color; the preview palette maps it to white.
                style.color = '#000000';
                if (style.font) style.font.color = { argb: 'FF000000' };
            };

            const applyRichTextRuns = (sheet, sheetIndex) => {
                const richTextMeta = window.__excelRichTextMeta;
                const sheetMeta = richTextMeta && richTextMeta[sheetIndex];
                if (!sheetMeta || !sheet || !sheet.rows) return;
                Object.keys(sheetMeta).forEach((key) => {
                    const parts = key.split(':');
                    if (parts.length !== 2) return;
                    const row = sheet.rows[parts[0]];
                    const cell = row && row.cells ? row.cells[parts[1]] : null;
                    if (!cell) return;
                    const runs = sheetMeta[key];
                    if (Array.isArray(runs) && runs.length > 0) {
                        cell.richText = runs;
                    }
                });
            };

            let visibleSheets = [];
            try {
                // 遍历每个工作表对象
                const meta = window.__excelHiddenMeta;
                workbookData.forEach((sheet, sheetIndex) => {
                    applyRichTextRuns(sheet, sheetIndex);

                    // 遍历 styles 数组
                    if (sheet.styles && Array.isArray(sheet.styles)) {
                        sheet.styles.forEach((style) => {
                            normalizeAutomaticFontColor(style);

                            // 尝试访问并修改 font.size 属性
                            if (style.font && style.font.size) {
                                // console.log('style.font.size=', style.font.size);
                                // 将字体大小放大1.2倍，并四舍五入到整数
                                style.font.size = Math.round(style.font.size * 1.2);
                            }

                            //如果不识别字体，包含  ?? 就默认使用宋体
                            if(style.font && style.font.name && style.font.name.includes('??')){
                                style.font.name = '宋体'
                            }
                        });
                    }

                    const sheetMeta = meta && meta.sheets && meta.sheets[sheetIndex] ? meta.sheets[sheetIndex] : null;
                    const isHiddenSheet = sheetMeta && (sheetMeta.hidden === true || sheetMeta.visibility === 'hidden' || sheetMeta.visibility === 'veryHidden');
                    if (isHiddenSheet) {
                        return;
                    }

                    const hiddenCols = getHiddenColIndexes(sheet, sheetIndex);
                    applyHiddenCols(sheet, hiddenCols);

                    const hiddenRows = getHiddenRowIndexes(sheet, sheetIndex);
                    applyHiddenRows(sheet, hiddenRows);

                    visibleSheets.push(sheet);
                });
            } catch (error) {
                console.error("调整字体size异常", error);
            }
            // 如果过滤后仍有可见sheet，则只返回这些；否则返回原始数据避免崩溃
            if (Array.isArray(workbookData) && workbookData.length > 0) {
                const meta = window.__excelHiddenMeta;
                const hasVisible = meta && meta.sheets ? meta.sheets.some((s) => !(s.hidden === true || s.visibility === 'hidden' || s.visibility === 'veryHidden')) : true;
                if (hasVisible) {
                    return (typeof visibleSheets !== 'undefined' && visibleSheets.length > 0) ? visibleSheets : workbookData;
                }
            }
            return workbookData;
        }
    };


    const myExcelPreviewer = jsPreviewExcel.init(document.getElementById('excel'),options);

    // 从 URL 中提取查询参数
    const urlParams = new URLSearchParams(window.location.search);
    pdfUrl = urlParams.get('file');

    const extractOriginalFileUrl = (fileUrl) => {
        try {
            const u = new URL(fileUrl, window.location.href);
            const urlPath = u.searchParams.get('urlPath');
            if (u.pathname.includes('/getCorsFile') && urlPath) {
                return Base64.decode(decodeURIComponent(urlPath));
            }
        } catch (e) {}
        return fileUrl;
    };

    const fetchHiddenMeta = async () => {
        const originalFileUrl = extractOriginalFileUrl(pdfUrl);
        const metaUrl = "../excelHiddenMeta?urlPath=" + encodeURIComponent(Base64.encode(originalFileUrl));
        const resp = await fetch(metaUrl, { credentials: 'same-origin' });
        const json = await resp.json();
        if (json && json.code === 0 && json.content) return json.content;
        return null;
    };

    const removeContextMenus = () => {
        const menus = document.querySelectorAll('.x-spreadsheet-contextmenu');
        menus.forEach((el) => el.remove());
    };

    const installSheetRenameBlocker = () => {
        if (window.__disable_sheet_rename_installed) return;
        window.__disable_sheet_rename_installed = true;
        const isSheetTab = (target) => {
            if (!target || !target.closest) return false;
            return !!target.closest('.x-spreadsheet-bottombar .x-spreadsheet-menu > li');
        };
        const stop = (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return false;
        };
        document.addEventListener('dblclick', (e) => {
            if (isSheetTab(e.target)) return stop(e);
        }, true);
        document.addEventListener('mousedown', (e) => {
            if (e.detail > 1 && isSheetTab(e.target)) return stop(e);
        }, true);
    };

    const installContextMenuBlocker = () => {
        const styleId = '__disable_x_spreadsheet_contextmenu';
        if (!document.getElementById(styleId)) {
            const style = document.createElement('style');
            style.id = styleId;
            style.textContent = '.x-spreadsheet-contextmenu{display:none!important;}';
            document.head.appendChild(style);
        }
        removeContextMenus();
        const observer = new MutationObserver(() => removeContextMenus());
        observer.observe(document.body, { childList: true, subtree: true });
    };

    // 先下载文件到内存，避免一次性URL被后端excelHiddenMeta消耗导致前端下载到0字节文件(Corrupted zip错误)
    fetch(pdfUrl).then(res => res.arrayBuffer()).then(buffer => {
        fetchHiddenMeta().then((meta) => {
            if (meta) window.__excelHiddenMeta = meta;
        }).catch(() => {}).finally(() => {
            myExcelPreviewer.preview(buffer).then(()=>{
                console.log('预览完成');
                installContextMenuBlocker();
                installSheetRenameBlocker();
                try {
                    const meta = window.__excelHiddenMeta;
                    if (meta && Array.isArray(meta.sheets)) {
                        const hiddenNames = new Set(
                            meta.sheets
                                .filter((s) => s && (s.hidden === true || s.visibility === 'hidden' || s.visibility === 'veryHidden'))
                                .map((s) => String(s.name || '').trim())
                                .filter((s) => s.length > 0),
                        );
                        if (hiddenNames.size > 0) {
                            const items = document.querySelectorAll('.x-spreadsheet-bottombar .x-spreadsheet-menu > li');
                            items.forEach((li) => {
                                const text = (li && li.textContent ? li.textContent : '').trim();
                                if (hiddenNames.has(text)) {
                                    li.style.display = 'none';
                                }
                            });
                        }
                    }
                } catch (e) {}

                // 隐藏loading层
                document.getElementById('loading-overlay').classList.add('hidden');
            }).catch(e=>{
                console.log('Preview failed', e);
                document.getElementById('loading-overlay').querySelector('.loading-text').innerText = 'Preview failed, please download instead.';
                document.getElementById('loading-overlay').querySelector('.spinner').style.display = 'none';
            })
        });
    }).catch(e => {
        console.error('Failed to download file', e);
        // 如果下载失败，尝试降级直接使用原始URL预览
        myExcelPreviewer.preview(pdfUrl).then(() => {
            installContextMenuBlocker();
            installSheetRenameBlocker();
            document.getElementById('loading-overlay').classList.add('hidden');
        }).catch(err => {
            console.log('Preview failed', err);
            document.getElementById('loading-overlay').querySelector('.loading-text').innerText = 'File download and preview failed, please download instead.';
            document.getElementById('loading-overlay').querySelector('.spinner').style.display = 'none';
        });
    });


</script>
</body>
</html>
